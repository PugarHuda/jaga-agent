name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test               # engine + integration (live Binance public book + history)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e       # Playwright drives the real dashboard on a replayed real crash
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-dashboard, path: e2e-dashboard.png, if-no-files-found: ignore }
